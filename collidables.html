<!DOCTYPE html>
<html>
  <head>
    <!-- A-Frame library for building VR experiences -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- A-Frame Physics System for adding physics to A-Frame scenes -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.1.0/dist/aframe-physics-system.js"></script>

    <!-- A-Frame Extras for additional components and systems -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.1/dist/aframe-extras.min.js"></script>

    <!-- A-Frame Environment Component for creating 3D environments -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

    <!-- Super Hands for handling interactions like grabbing and dragging objects -->
    <script src="https://cdn.jsdelivr.net/gh/LugawPlain/aframe-super-hands-component@master/dist/super-hands.min.js"></script>

    <!-- A-Frame Event Set Component for setting multiple event handlers -->
    <script src="https://unpkg.com/aframe-event-set-component@^4.1.1/dist/aframe-event-set-component.min.js"></script>

    <!-- A-Frame Physics Extras for additional physics-related components -->
    <script src="https://unpkg.com/aframe-physics-extras/dist/aframe-physics-extras.min.js"></script>

    <!-- A-Frame GUI for creating graphical user interfaces in VR -->
    <script src="https://cdn.jsdelivr.net/gh/rdub80/aframe-gui@v0.3.2/dist/aframe-gui.min.js"></script>

    <!-- Three.js Orbit Controls for enabling orbiting around objects -->
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js/r128/three.min.js"></script>
  </head>
  <body>
    <a-scene physics="gravity: -9.8">
      <a-entity environment="preset: forest"></a-entity>
      
      <!-- Camera and Environment -->
      <a-entity position="0 2 5">
        <a-camera look-controls="pointerLockEnabled: true">
          <a-cursor color="yellow" fuse="true" fuse-timeout="500"></a-cursor>
        </a-camera>
      </a-entity>
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="green" static-body></a-plane>
      
      <!-- Projectile -->
      <a-sphere id="projectile" position="-3 1 0" radius="0.2" color="red" dynamic-body></a-sphere>
      
      <!-- Launch Button -->
      <a-box id="launchButton" position="-3 1.5 0" width="0.5" height="0.2" depth="0.5" color="blue" event-set__click="_event: click; _target: #projectile; impulse: 3 5 0;"></a-box>
      <a-text value="Launch" position="-3 1.7 0.1" align="center"></a-text>
      
      <!-- Reset Button -->
      <a-box id="resetButton" position="-3 2 0" width="0.5" height="0.2" depth="0.5" color="orange"></a-box>
      <a-text value="Reset" position="-3 2.2 0.1" align="center"></a-text>

      <!-- Back Button -->
      <a-box id="backButton" position="-3 2.5 0" width="0.5" height="0.2" depth="0.5" color="purple"></a-box>
      <a-text value="Back" position="-3 2.7 0.1" align="center"></a-text>

      <!-- Adjustable Parameters -->
      <a-entity id="controls" position="0 2 5">
        <!-- Angle Controls -->
        <a-box id="angleAdd" position="2 0.5 0" width="0.3" height="0.3" depth="0.3" color="green"></a-box>
        <a-text value="+" position="2 0.7 0.1" align="center"></a-text>
        <a-box id="angleSubtract" position="-2 0.5 0" width="0.3" height="0.3" depth="0.3" color="red"></a-box>
        <a-text value="-" position="-2 0.7 0.1" align="center"></a-text>
        <a-text value="Angle: 45°" id="angleText" position="0 0.5 0.1" align="center"></a-text>

        <!-- Speed Controls -->
        <a-box id="speedAdd" position="2 -0.5 0" width="0.3" height="0.3" depth="0.3" color="green"></a-box>
        <a-text value="+" position="2 -0.3 0.1" align="center"></a-text>
        <a-box id="speedSubtract" position="-2 -0.5 0" width="0.3" height="0.3" depth="0.3" color="red"></a-box>
        <a-text value="-" position="-2 -0.3 0.1" align="center"></a-text>
        <a-text value="Speed: 10 m/s" id="speedText" position="0 -0.5 0.1" align="center"></a-text>
      </a-entity>

      <!-- Trajectory Visualization -->
      <a-entity id="trajectory"></a-entity>

      <!-- Script for Enhanced Features -->
      <script>
        AFRAME.registerComponent('launch-projectile', {
          init: function () {
            const button = document.querySelector('#launchButton');
            const resetButton = document.querySelector('#resetButton');
            const backButton = document.querySelector('#backButton');
            const projectile = document.querySelector('#projectile');
            const angleAdd = document.querySelector('#angleAdd');
            const angleSubtract = document.querySelector('#angleSubtract');
            const speedAdd = document.querySelector('#speedAdd');
            const speedSubtract = document.querySelector('#speedSubtract');
            const angleText = document.querySelector('#angleText');
            const speedText = document.querySelector('#speedText');
            const trajectory = document.querySelector('#trajectory');

            let angle = 45; // Default angle
            let speed = 10; // Default speed

            // Back button functionality
            backButton.addEventListener('click', function () {
              window.location.href = '4Projectile Motion.html';
            });

            // Update angle
            angleAdd.addEventListener('click', function () {
              if (angle < 90) {
                angle += 1;
                angleText.setAttribute('value', `Angle: ${angle}°`);
              }
            });
            angleSubtract.addEventListener('click', function () {
              if (angle > 1) {
                angle -= 1;
                angleText.setAttribute('value', `Angle: ${angle}°`);
              }
            });

            // Update speed
            speedAdd.addEventListener('click', function () {
              if (speed < 100) {
                speed += 1;
                speedText.setAttribute('value', `Speed: ${speed} m/s`);
              }
            });
            speedSubtract.addEventListener('click', function () {
              if (speed > 1) {
                speed -= 1;
                speedText.setAttribute('value', `Speed: ${speed} m/s`);
              }
            });

            // Launch projectile
            button.addEventListener('click', function () {
              const radianAngle = ((90 - angle) * Math.PI) / 180; // Adjusted to make higher values steeper

              // Calculate velocity components
              const velocityX = speed * Math.cos(radianAngle);
              const velocityY = speed * Math.sin(radianAngle);

              // Apply impulse to the projectile
              const body = projectile.body;
              if (body) {
                body.velocity.set(velocityX, velocityY, 0); // Set velocity directly
              }

              // Visualize trajectory
              visualizeTrajectory(velocityX, velocityY);
            });

            // Reset projectile
            resetButton.addEventListener('click', function () {
              const body = projectile.body;
              if (body) {
                body.velocity.set(0, 0, 0); // Reset velocity
                body.position.set(-3, 1, 0); // Reset position
                body.angularVelocity.set(0, 0, 0); // Reset angular velocity
                body.quaternion.set(0, 0, 0, 1); // Reset rotation
              }
              trajectory.innerHTML = ''; // Clear trajectory
            });

            // Function to visualize trajectory
            function visualizeTrajectory(vx, vy) {
              trajectory.innerHTML = ''; // Clear previous trajectory
              const g = 9.8; // Gravity
              const points = [];
              for (let t = 0; t <= 2 * vy / g; t += 0.1) {
                const x = vx * t;
                const y = vy * t - 0.5 * g * t * t;
                if (y < 0) break; // Stop if below ground
                points.push(`<a-sphere position="${x} ${y} 0" radius="0.05" color="yellow"></a-sphere>`);
              }
              trajectory.innerHTML = points.join('');
            }
          }
        });

        document.querySelector('#launchButton').setAttribute('launch-projectile', '');
      </script>
    </a-scene>
  </body>
</html>
